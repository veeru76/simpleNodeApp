name: CI/CD Pipeline

# 1. Triggers on push or pull request to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    # 2. GitHub Actions provisions an Ubuntu VM to run this job
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code onto the runner VM
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js on the runner
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Step 3: Install the application dependencies
      - name: Install Dependencies
        run: npm install

      # Step 4: Run the automated tests to ensure code is working
      - name: Run Tests
        run: npm test

      # Step 5: Build the Docker image
      - name: Build Docker Image
        run: docker build -t simple-cicd-app:latest .
        
      # Step 6: Check if secrets are loaded
      - name: Verify Secrets Exist
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then echo "ERROR: DOCKER_USERNAME secret is empty!"; exit 1; fi
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then echo "ERROR: DOCKER_PASSWORD secret is empty!"; exit 1; fi
          echo "Both secrets are loaded successfully."

      # Step 7: Push to Docker Hub
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker Image
        run: |
          docker tag simple-cicd-app:latest ${{ secrets.DOCKER_USERNAME }}/simple-cicd-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/simple-cicd-app:latest
